name: FYP Compass quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix backend/local-tests --ignore-scripts
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npm run test:cloud
      - run: npm run test:email
      - run: npm run test:accounts
      - run: npm run db:check
      - run: npm run test:database
      - run: npm run test:local-http
      - run: cp .env.demo.example .env.demo
      - run: npm run build:demo
