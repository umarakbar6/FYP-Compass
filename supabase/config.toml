[functions.fyp-enquiries-v1]
verify_jwt = false

[functions.fyp-assistants-v1]
verify_jwt = false

[functions.fyp-invite-users-v1]
verify_jwt = false

[functions.fyp-reminder-delivery-v1]
verify_jwt = false

[auth]
site_url = "https://fyp-compass-ten.vercel.app"
additional_redirect_urls = ["https://fyp-compass-ten.vercel.app/auth/reset", "https://fyp-compass-ten.vercel.app/login", "https://fyp-compass-ten.vercel.app/auth/confirm"]
minimum_password_length = 12
jwt_expiry = 900
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_expiry = 900

# Custom SMTP is required for this allowance. See docs/SIGNUP-EMAIL-LIMIT-FIX-2026-10-14.md.
# CLI 2.120 config push treats this property as unmanaged; verify the cloud setting separately.
[auth.rate_limit]
email_sent = 30

# Native IP token/verification buckets, separate from total account caps.
token_refresh = 100
verify = 20
